name: Release precompiled binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precompiled-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The build hook honours CARGO_TARGET_DIR; keep it where rust-cache looks.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  precompile:
    name: Precompile ${{ matrix.platform }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: apple
            os: macos-latest
          - platform: android
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PRIVATE_REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.PRIVATE_REPO_ACCESS_APP_PRIVATE_KEY }}
          permission-contents: read
          owner: BitcreditProtocol

      - name: Git auth with app token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Activate cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: wallet-ffi-precompiled-${{ matrix.platform }}

      - name: Fetch tool dependencies
        working-directory: tool
        run: dart pub get

      # Builds each target with the build hook's own builder (hook/src), signs
      # it and uploads it to the precompiled_<crate hash> release. The Rust
      # toolchain and targets come from crates/bcr-wallet-ffi/rust-toolchain.toml.
      - name: Precompile iOS and macOS
        if: matrix.platform == 'apple'
        working-directory: tool
        run: |
          dart run precompile_binaries.dart \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --target=aarch64-apple-ios \
            --target=aarch64-apple-ios-sim \
            --target=x86_64-apple-ios \
            --target=aarch64-apple-darwin \
            --target=x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}

      - name: Precompile Android
        if: matrix.platform == 'android'
        working-directory: tool
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ndk_path="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk_path" ]; then
            ndk_path="$(find "$android_sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          echo "NDK: $ndk_path"

          dart run precompile_binaries.dart \
            --repository="$GITHUB_REPOSITORY" \
            --target-commitish="$GITHUB_SHA" \
            --prerelease \
            --android-ndk="$ndk_path" \
            --target=armv7-linux-androideabi \
            --target=aarch64-linux-android \
            --target=x86_64-linux-android
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.PRECOMPILED_BINARIES_SIG_PRIVATE_KEY }}
